[package]
name = "paim"
version = "0.1.0"
description = "prompt and image manager"
authors = ["perphyyoung"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2"
chrono = "0.4"
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff"] }
jpeg-encoder = { version = "0.6", features = ["simd"] }
md-5 = "0.10"
# 本地 embedding 服务（llama.cpp llama-server）调用：只访问 127.0.0.1 明文 HTTP，故关闭 TLS 特性
ureq = { version = "2", default-features = false, features = ["json"] }
base64 = "0.22"
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-global-shortcut = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "javascript", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
# 资源管理器定位（SHOpenFolderAndSelectItems）；版本与 tauri 依赖的 windows 一致，避免重复编译
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
